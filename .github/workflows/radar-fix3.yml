name: Radar robust repair
on:
  push:
    branches:
      - integration/conexa-unified
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Radar endpoint
        run: |
          echo '  ' | tr -d ' ' | base64 -d >/tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git diff --cached --quiet || git commit -m 'security: repair Radar conversion endpoint'
          git push
