name: Apply account deletion hardening

on:
  push:
    branches: [integration/conexa-unified]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/harden_account_deletion.py
      - name: Remove migration helpers
        run: |
          rm scripts/harden_account_deletion.py
          rm .github/workflows/temporary-account-deletion-hardening.yml
      - name: Commit canonical changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git add -u scripts/harden_account_deletion.py .github/workflows/temporary-account-deletion-hardening.yml
          git commit -m 'security: complete account deletion across canonical data stores'
          git push origin HEAD:integration/conexa-unified
