name: Wire admin verification document viewer

on:
  push:
    branches: [integration/conexa-unified]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/wire_admin_verification_view.py
      - name: Remove migration helpers
        run: |
          rm scripts/wire_admin_verification_view.py
          rm .github/workflows/temporary-admin-verification-view.yml
      - name: Commit canonical changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AdminPanel.tsx
          git add -u scripts/wire_admin_verification_view.py .github/workflows/temporary-admin-verification-view.yml
          git commit -m 'feat: allow admins to inspect verification documents securely'
          git push origin HEAD:integration/conexa-unified
