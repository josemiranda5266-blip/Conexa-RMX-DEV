name: Conexa unified build

on:
  push:
    branches:
      - unification/conexa-unified
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unification/conexa-unified
          fetch-depth: 0
      - name: Assemble from source repositories
        run: bash scripts/unify-repos.sh
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated unified tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: assemble unified Conexa tree'
          git push origin HEAD:unification/conexa-unified
