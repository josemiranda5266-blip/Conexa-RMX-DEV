name: Canonical finalize verification wiring

on:
  push:
    branches: [integration/conexa-unified]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conexa-canonical-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/conexa-unified
      - name: Apply final verification UI patch
        run: python3 scripts/finalize_verification_ui_wiring.py
      - name: Remove temporary migration files
        run: |
          rm scripts/finalize_verification_ui_wiring.py
          rm .github/workflows/finalize-verification-ui-wiring.yml
          rm .github/workflows/canonical-finalize-verification.yml
          rm -f .github/workflows/temporary-admin-verification-view.yml
          rm -f .github/workflows/temporary-verification-upload-wiring.yml
          rm -f .github/workflows/temporary-admin-verification-document-route.yml
          rm -f .github/workflows/temporary-context-scope-hardening.yml
          rm -f .github/workflows/temporary-account-deletion-hardening.yml
          rm -f .github/workflows/temporary-verification-type-alignment.yml
          rm -f scripts/wire_admin_verification_view.py
          rm -f scripts/wire_professional_verification_upload.py
          rm -f scripts/add_verification_admin_document_route.py
          rm -f scripts/harden_context_scopes.py
          rm -f scripts/harden_account_deletion.py
          rm -f scripts/align_verification_type.py
          git fetch origin integration/conexa-unified
          git reset --hard origin/integration/conexa-unified
          python3 scripts/finalize_verification_ui_wiring.py
          rm scripts/finalize_verification_ui_wiring.py
      - name: Commit on latest canonical head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finalize verification document upload and admin review flow'
          git push origin HEAD:integration/conexa-unified
