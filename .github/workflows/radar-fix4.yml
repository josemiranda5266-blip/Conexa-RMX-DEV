name: Radar typo correction
on:
  push:
    branches:
      - integration/conexa-unified
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix typo
        run: sed -i 's/Numer(opportunity.estimatedBudgetArs)/Number(opportunity.estimatedBudgetArs)/g' server.ts
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git diff --cached --quiet || git commit -m 'fix: correct Radar budget normalization'
          git push
