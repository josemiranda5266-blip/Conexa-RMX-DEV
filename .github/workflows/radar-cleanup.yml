name: Radar cleanup
on:
  push:
    branches:
      - integration/conexa-unified
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary workflows
        run: |
          git rm -f .github/workflows/radar-fix*.yml .github/workflows/radar-hardening.yml .github/workflows/radar-cleanup.yml 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'chore: remove temporary Radar patch workflows'
          git push
