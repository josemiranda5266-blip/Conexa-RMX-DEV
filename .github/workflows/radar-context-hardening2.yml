name: Radar context hardening retry
on:
  push:
    branches:
      - integration/conexa-unified
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply boundary hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/context/AppContext.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace("      documentUrl: 'https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&q=80&w=400',", "      documentPath: '',", 1)
          radar=s.index('const unsubRadarOpportunities = onSnapshot(')
          guard=s.rfind('if (!isFirebaseConfigured || !db) return;', 0, radar)
          assert guard >= 0
          s=s[:guard]+"if (!isFirebaseConfigured || !db || !currentUser || !['ADMIN', 'SUPER_ADMIN'].includes(currentUser.role)) return;"+s[guard+len('if (!isFirebaseConfigured || !db) return;'):]
          radar=s.index('const unsubRadarOpportunities = onSnapshot(')
          close=s.index('  }, []);', radar)
          s=s[:close]+"  }, [currentUser?.id, currentUser?.role]);"+s[close+len('  }, []);'):]
          s=s.replace("  const addRadarOpportunity = (opp: RadarOpportunity) => {", "  const addRadarOpportunity = (opp: RadarOpportunity) => {\n    if (isFirebaseConfigured && !isAdmin()) return;\n    if (isFirebaseConfigured && opp.environment === 'simulation') return;", 1)
          s=s.replace("  const updateRadarOpportunity = (id: string, updates: Partial<RadarOpportunity>) => {", "  const updateRadarOpportunity = (id: string, updates: Partial<RadarOpportunity>) => {\n    if (isFirebaseConfigured && !isAdmin()) return;\n    if (isFirebaseConfigured && updates.environment === 'simulation') return;", 1)
          s=s.replace("  const deleteRadarOpportunity = (id: string) => {", "  const deleteRadarOpportunity = (id: string) => {\n    if (isFirebaseConfigured && !isAdmin()) return;", 1)
          s=s.replace("  const convertRadarOpportunity = (opportunityId: string, userId?: string) => {", "  const convertRadarOpportunity = (opportunityId: string, userId?: string) => {\n    if (isFirebaseConfigured && !isAdmin()) return;", 1)
          s=s.replace("  const updateApprovalMode = async (mode: ApprovalMode): Promise<void> => {", "  const updateApprovalMode = async (mode: ApprovalMode): Promise<void> => {\n    if (isFirebaseConfigured && !isAdmin()) throw new Error('No tenés permisos para cambiar el modo de aprobación RADAR.');", 1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/context/AppContext.tsx
          git diff --cached --quiet || git commit -m 'security: enforce Radar production boundaries'
          git push
