name: Apply unified job lifecycle hardening

on:
  push:
    branches: [unification/conexa-unified]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply lifecycle patch
        run: python3 scripts/apply_job_lifecycle_patch.py
      - name: Validate source changes
        run: |
          test -s server.ts
          test -s src/context/AppContext.tsx
          grep -q '/api/jobs/start' server.ts
          grep -q '/api/jobs/complete' server.ts
          grep -q 'completeJob' src/context/AppContext.tsx
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts src/context/AppContext.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: harden unified job lifecycle transitions'
          git push origin HEAD:unification/conexa-unified
