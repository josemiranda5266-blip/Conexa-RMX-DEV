name: Apply unified job lifecycle hardening

on:
  push:
    branches:
      - unification/conexa-unified
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch backend and context
        shell: python
        run: |
          from pathlib import Path

          server = Path('server.ts')
          text = server.read_text(encoding='utf-8')

          marker = '  // Account Deletion API Endpoint (GDPR/ARCO Compliance)'
          if '/api/jobs/start' not in text and marker in text:
              routes = r'''  // Authoritative job lifecycle: paid contract -> in progress.
            app.post("/api/jobs/start", rateLimiter, async (req: Request, res: Response) => {
              try {
                const auth = await verifyAuthToken(req);
                if (!auth.isAuthenticated || !auth.userId) {
                  return res.status(401).json({ success: false, error: "Se requiere autenticación válida.", code: "UNAUTHORIZED" });
                }

                const { requestId } = req.body || {};
                if (!requestId || typeof requestId !== 'string') {
                  return res.status(400).json({ success: false, error: "requestId es obligatorio.", code: "INVALID_REQUEST_ID" });
                }

                const firestore = await getAdminDb();
                const requestRef = firestore.collection('service_requests').doc(requestId);
                const requestSnap = await requestRef.get();
                if (!requestSnap.exists) {
                  return res.status(404).json({ success: false, error: "Solicitud no encontrada.", code: "REQUEST_NOT_FOUND" });
                }

                const txSnap = await firestore.collection('transactions')
                  .where('serviceRequestId', '==', requestId)
                  .limit(1)
                  .get();
                if (txSnap.empty) {
                  return res.status(409).json({ success: false, error: "No existe una transacción asociada al trabajo.", code: "TRANSACTION_NOT_FOUND" });
                }

                const transactionRef = txSnap.docs[0].ref;
                const transaction = txSnap.docs[0].data() || {};
                const request = requestSnap.data() || {};

                if (transaction.professionalId !== auth.userId) {
                  return res.status(403).json({ success: false, error: "Solo el profesional contratado puede iniciar el trabajo.", code: "FORBIDDEN_JOB_ACTOR" });
                }
                if (request.status !== 'PROFESSIONAL_SELECTED') {
                  return res.status(409).json({ success: false, error: "El trabajo no está listo para iniciarse.", code: "JOB_NOT_STARTABLE" });
                }
                if (transaction.status !== 'PAID') {
                  return res.status(409).json({ success: false, error: "El pago del trabajo todavía no está confirmado.", code: "PAYMENT_NOT_CONFIRMED" });
                }

                await firestore.runTransaction(async (tx: any) => {
                  const currentRequest = await tx.get(requestRef);
                  const currentTransaction = await tx.get(transactionRef);
                  const currentRequestData = currentRequest.data() || {};
                  const currentTransactionData = currentTransaction.data() || {};
                  if (currentTransactionData.professionalId !== auth.userId) throw new Error('FORBIDDEN_JOB_ACTOR');
                  if (currentRequestData.status !== 'PROFESSIONAL_SELECTED') throw new Error('JOB_NOT_STARTABLE');
                  if (currentTransactionData.status !== 'PAID') throw new Error('PAYMENT_NOT_CONFIRMED');
                  tx.update(requestRef, { status: 'IN_PROGRESS', startedAt: new Date().toISOString() });
                  tx.update(transactionRef, { status: 'SERVICE_IN_PROGRESS', serviceStartedAt: new Date().toISOString() });
                });

                return res.json({ success: true, requestId, status: 'IN_PROGRESS' });
              } catch (err: any) {
                const code = err?.message || 'JOB_START_ERROR';
                const map: Record<string, number> = {
                  FORBIDDEN_JOB_ACTOR: 403,
                  JOB_NOT_STARTABLE: 409,
                  PAYMENT_NOT_CONFIRMED: 409,
                  REQUEST_NOT_FOUND: 404,
                  TRANSACTION_NOT_FOUND: 409
                };
                return res.status(map[code] || 500).json({ success: false, error: map[code] ? `No se puede iniciar el trabajo: ${code}.` : "Error interno al iniciar el trabajo.", code });
              }
            });

            // Authoritative job completion: only the contracted professional can close the service.
            app.post("/api/jobs/complete", rateLimiter, async (req: Request, res: Response) => {
              try {
                const auth = await verifyAuthToken(req);
                if (!auth.isAuthenticated || !auth.userId) {
                  return res.status(401).json({ success: false, error: "Se requiere autenticación válida.", code: "UNAUTHORIZED" });
                }

                const { requestId } = req.body || {};
                if (!requestId || typeof requestId !== 'string') {
                  return res.status(400).json({ success: false, error: "requestId es obligatorio.", code: "INVALID_REQUEST_ID" });
                }

                const firestore = await getAdminDb();
                const requestRef = firestore.collection('service_requests').doc(requestId);
                const requestSnap = await requestRef.get();
                if (!requestSnap.exists) {
                  return res.status(404).json({ success: false, error: "Solicitud no encontrada.", code: "REQUEST_NOT_FOUND" });
                }

                const txSnap = await firestore.collection('transactions')
                  .where('serviceRequestId', '==', requestId)
                  .limit(1)
                  .get();
                if (txSnap.empty) {
                  return res.status(409).json({ success: false, error: "No existe una transacción asociada al trabajo.", code: "TRANSACTION_NOT_FOUND" });
                }

                const transactionRef = txSnap.docs[0].ref;
                const transaction = txSnap.docs[0].data() || {};
                const request = requestSnap.data() || {};

                if (transaction.professionalId !== auth.userId) {
                  return res.status(403).json({ success: false, error: "Solo el profesional contratado puede completar el trabajo.", code: "FORBIDDEN_JOB_ACTOR" });
                }
                if (request.status !== 'IN_PROGRESS') {
                  return res.status(409).json({ success: false, error: "El trabajo no está en ejecución.", code: "JOB_NOT_COMPLETABLE" });
                }
                if (transaction.status !== 'SERVICE_IN_PROGRESS') {
                  return res.status(409).json({ success: false, error: "La transacción no está en estado de servicio en curso.", code: "TRANSACTION_NOT_IN_PROGRESS" });
                }

                await firestore.runTransaction(async (tx: any) => {
                  const currentRequest = await tx.get(requestRef);
                  const currentTransaction = await tx.get(transactionRef);
                  const currentRequestData = currentRequest.data() || {};
                  const currentTransactionData = currentTransaction.data() || {};
                  if (currentTransactionData.professionalId !== auth.userId) throw new Error('FORBIDDEN_JOB_ACTOR');
                  if (currentRequestData.status !== 'IN_PROGRESS') throw new Error('JOB_NOT_COMPLETABLE');
                  if (currentTransactionData.status !== 'SERVICE_IN_PROGRESS') throw new Error('TRANSACTION_NOT_IN_PROGRESS');
                  const completedAt = new Date().toISOString();
                  tx.update(requestRef, { status: 'REVIEW_PENDING', completedAt });
                  tx.update(transactionRef, { status: 'SERVICE_COMPLETED', serviceCompletedAt: completedAt });
                });

                return res.json({ success: true, requestId, status: 'REVIEW_PENDING' });
              } catch (err: any) {
                const code = err?.message || 'JOB_COMPLETE_ERROR';
                const map: Record<string, number> = {
                  FORBIDDEN_JOB_ACTOR: 403,
                  JOB_NOT_COMPLETABLE: 409,
                  TRANSACTION_NOT_IN_PROGRESS: 409,
                  REQUEST_NOT_FOUND: 404,
                  TRANSACTION_NOT_FOUND: 409
                };
                return res.status(map[code] || 500).json({ success: false, error: map[code] ? `No se puede completar el trabajo: ${code}.` : "Error interno al completar el trabajo.", code });
              }
            });

'''
              text = text.replace(marker, routes + marker, 1)
              server.write_text(text, encoding='utf-8')

          context = Path('src/context/AppContext.tsx')
          c = context.read_text(encoding='utf-8')
          interface_marker = "  submitQuote: (quote: Omit<Quote, 'id' | 'createdAt' | 'status'>) => Promise<Quote>;"
          if 'completeJob: (requestId: string) => Promise<void>;' not in c:
              c = c.replace(interface_marker, interface_marker + " deleteAccount: (userId: string) => Promise<boolean>; completeJob: (requestId: string) => Promise<void>;")
              c = c.replace("  const value: AppContextType = {", r'''  const completeJob = async (requestId: string): Promise<void> => {
            if (!auth?.currentUser) throw new Error('Debés iniciar sesión para completar el trabajo.');
            if (!currentUser || currentUser.role !== 'PROFESSIONAL') throw new Error('Solo el profesional contratado puede completar el trabajo.');
            const token = await auth.currentUser.getIdToken();
            const response = await fetch('/api/jobs/complete', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
              body: JSON.stringify({ requestId })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.success) throw new Error(data.error || 'No se pudo completar el trabajo.');
            setRequests(prev => prev.map(r => r.id === requestId ? { ...r, status: 'REVIEW_PENDING' } : r));
            setTransactions(prev => prev.map(t => t.serviceRequestId === requestId ? { ...t, status: 'SERVICE_COMPLETED' } : t));
          };

          const value: AppContextType = {''', 1)
              c = c.replace('submitQuote, deleteAccount, acceptQuote, createMercadoPagoCheckout, connectMercadoPago', 'submitQuote, deleteAccount, acceptQuote, completeJob, createMercadoPagoCheckout, connectMercadoPago', 1)
              context.write_text(c, encoding='utf-8')

      - name: Validate patch
        run: |
          test -s server.ts
          test -s src/context/AppContext.tsx
          grep -q '/api/jobs/start' server.ts
          grep -q '/api/jobs/complete' server.ts
          grep -q 'completeJob' src/context/AppContext.tsx

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts src/context/AppContext.tsx
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: harden unified job lifecycle transitions'
          git push origin HEAD:unification/conexa-unified
