name: Wire professional verification upload

on:
  push:
    branches: [integration/conexa-unified]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/wire_professional_verification_upload.py
      - name: Remove migration helpers
        run: |
          rm scripts/wire_professional_verification_upload.py
          rm .github/workflows/temporary-verification-upload-wiring.yml
      - name: Commit canonical changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BecomeProfessionalModal.tsx src/services/verificationStorage.ts
          git add -u scripts/wire_professional_verification_upload.py .github/workflows/temporary-verification-upload-wiring.yml
          git commit -m 'feat: wire professional verification document upload'
          git push origin HEAD:integration/conexa-unified
