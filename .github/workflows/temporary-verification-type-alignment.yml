name: Align verification type with private storage

on:
  push:
    branches: [integration/conexa-unified]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/align_verification_type.py
      - name: Remove migration helpers
        run: |
          rm scripts/align_verification_type.py
          rm .github/workflows/temporary-verification-type-alignment.yml
      - name: Commit canonical changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types.ts
          git add -u scripts/align_verification_type.py .github/workflows/temporary-verification-type-alignment.yml
          git commit -m 'security: remove public verification document URL from type model'
          git push origin HEAD:integration/conexa-unified
