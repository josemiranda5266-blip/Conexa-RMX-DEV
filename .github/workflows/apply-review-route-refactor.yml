name: Apply review route refactor

on:
  push:
    branches:
      - integration/conexa-unified
    paths:
      - '.github/workflows/apply-review-route-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: integration/conexa-unified
          fetch-depth: 0

      - name: Patch server.ts
        shell: python
        run: |
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')

          import_line = 'import { handleProfessionalReviewSave } from "./src/server/reviewRoute.js";'
          if import_line not in s:
              anchor = 'import { verifyUserAuthToken } from "./src/server/auth.js";'
              if anchor not in s:
                  raise SystemExit('ANCHOR_IMPORT_NOT_FOUND')
              s = s.replace(anchor, anchor + '\n' + import_line, 1)

          start_marker = '  // Review creation and reputation aggregation are authoritative on the backend.'
          end_marker = '  // Backward-compatible close endpoint.'
          start = s.find(start_marker)
          end = s.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end < 0:
              if 'app.post("/api/reviews/create", rateLimiter, handleProfessionalReviewSave);' in s:
                  p.write_text(s, encoding='utf-8')
                  raise SystemExit(0)
              raise SystemExit(f'REVIEW_BLOCK_NOT_FOUND start={start} end={end}')

          replacement = '  app.post("/api/reviews/create", rateLimiter, handleProfessionalReviewSave);\n\n'
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          if git diff --cached --quiet; then
            echo "No server.ts changes needed."
            exit 0
          fi
          git commit -m "refactor(reviews): delegate create route to review handler"
          git push origin HEAD:integration/conexa-unified

      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/apply-review-route-refactor.yml
          git commit -m "chore: remove one-shot review route refactor workflow"
          git push origin HEAD:integration/conexa-unified
