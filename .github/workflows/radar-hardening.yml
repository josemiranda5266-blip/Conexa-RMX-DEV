name: Radar conversion hardening
on:
  push:
    branches: [integration/conexa-unified]
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')
          old = '''      const opportunityRef = firestore.collection("radar_opportunities").doc(opportunityId);
      const requestRef = firestore.collection("service_requests").doc();
      const now = new Date().toISOString();'''
          new = '''      const opportunityRef = firestore.collection("radar_opportunities").doc(opportunityId);
      const requestRef = firestore.collection("service_requests").doc();
      const now = new Date().toISOString();'''
          if old not in s:
              raise SystemExit('anchor not found')
          marker = '''        const opportunity = opportunitySnap.data() || {};
        if (opportunity.clientId !== auth.userId) throw new Error("FORBIDDEN_OPPORTUNITY_OWNER");'''
          replacement = '''        const opportunity = opportunitySnap.data() || {};
        const opportunityOwnerId = String(opportunity.clientUserId || opportunity.clientId || "").trim();
        if (opportunityOwnerId !== auth.userId) throw new Error("FORBIDDEN_OPPORTUNITY_OWNER");
        if (!['REGISTERED', 'MATCHED', 'SERVICE_REQUESTED'].includes(String(opportunity.status || ''))) {
          throw new Error("RADAR_OPPORTUNITY_NOT_CONVERTIBLE");
        }
        if (opportunity.consentStatus === 'PENDING_CONSENT') throw new Error("RADAR_CONSENT_REQUIRED");

        if (opportunity.serviceRequestId) {
          const existingRequestRef = firestore.collection('service_requests').doc(String(opportunity.serviceRequestId));
          const existingRequestSnap = await tx.get(existingRequestRef);
          if (existingRequestSnap.exists) {
            const existingRequest = existingRequestSnap.data() || {};
            if (existingRequest.clientId !== auth.userId || existingRequest.radarOpportunityId !== opportunityId) {
              throw new Error("RADAR_REQUEST_OWNERSHIP_MISMATCH");
            }
            return { ...existingRequest, id: existingRequest.id || existingRequestSnap.id };
          }
        }'''
          if marker not in s:
              raise SystemExit('owner marker not found')
          s = s.replace(marker, replacement, 1)
          marker2 = '''        if (candidateIds.length === 0) throw new Error("NO_RADAR_CANDIDATES");'''
          replacement2 = '''        if (candidateIds.length === 0) throw new Error("NO_RADAR_CANDIDATES");

        const candidateSnapshots = await Promise.all(
          candidateIds.map((candidateId: string) => tx.get(firestore.collection('users').doc(candidateId)))
        );
        const validCandidateIds = candidateIds.filter((candidateId: string, index: number) => {
          const data = candidateSnapshots[index].data() || {};
          return candidateSnapshots[index].exists && data.isBlocked !== true &&
            (data.role === 'PROFESSIONAL' || data.isProfessional === true || data.hasProfessionalProfile === true);
        });
        if (validCandidateIds.length === 0) throw new Error("NO_VALID_RADAR_CANDIDATES");'''
          if marker2 not in s:
              raise SystemExit('candidate marker not found')
          s = s.replace(marker2, replacement2, 1)
          s = s.replace('biddingProfessionalIds: candidateIds,', 'biddingProfessionalIds: validCandidateIds,', 1)
          s = s.replace('''        tx.set(requestRef, request);''', '''        tx.create(requestRef, request);''', 1)
          s = s.replace('''        NO_RADAR_CANDIDATES: 409
      };''', '''        NO_RADAR_CANDIDATES: 409,
        NO_VALID_RADAR_CANDIDATES: 409,
        RADAR_OPPORTUNITY_NOT_CONVERTIBLE: 409,
        RADAR_CONSENT_REQUIRED: 409,
        RADAR_REQUEST_OWNERSHIP_MISMATCH: 409
      };''', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git diff --cached --quiet || git commit -m 'security: harden Radar conversion idempotency and candidates'
          git push
