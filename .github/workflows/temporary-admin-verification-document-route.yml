name: Add admin verification document access boundary

on:
  push:
    branches: [integration/conexa-unified]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/add_verification_admin_document_route.py
      - name: Remove migration helpers
        run: |
          rm scripts/add_verification_admin_document_route.py
          rm .github/workflows/temporary-admin-verification-document-route.yml
      - name: Commit canonical changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git add -u scripts/add_verification_admin_document_route.py .github/workflows/temporary-admin-verification-document-route.yml
          git commit -m 'security: add temporary admin access to verification documents'
          git push origin HEAD:integration/conexa-unified
