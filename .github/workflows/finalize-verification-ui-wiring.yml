name: Finalize verification UI wiring

on:
  push:
    branches: [integration/conexa-unified]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/finalize_verification_ui_wiring.py
      - name: Remove migration helpers
        run: |
          rm scripts/finalize_verification_ui_wiring.py
          rm .github/workflows/finalize-verification-ui-wiring.yml
      - name: Commit canonical changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BecomeProfessionalModal.tsx src/services/verificationStorage.ts src/components/AdminPanel.tsx
          git add -u scripts/finalize_verification_ui_wiring.py .github/workflows/finalize-verification-ui-wiring.yml
          git commit -m 'feat: complete verification document upload and admin review flow'
          git push origin HEAD:integration/conexa-unified
